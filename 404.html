	<head>

	</head>
	<body class="is-preload">

		<!-- Wrapper -->
			<div id="wrapper" class="fade-in">
				<!-- Intro -->
					<div id="intro">
						<div class="logo-panel" id = "logo-box">
							<img
								src="/img/404.jpg"
								alt="404 PAGE NOT FOUND"
								class="intro-logo"
							>
							<p id="intro-text">
								<br> Hello, <br> what you are looking for is away on vacation.
							</p>
							<!--<a href="https://www.bfjia.net/profile" class="button large"> Profile ➜</a>-->
							<p id = "Hide"> <u>Hide</u> </p>
						</div>
						<!--
						<ul class="actions">
							<li><a href="https://www.bfjia.net/presentations" class="button large">> Presentations <</a></li>
						</ul>
						-->
					</div>
			</div>

		<!-- Scripts -->
			<script src="/assets/js/jquery.min.js"></script>
			<script src="/assets/js/jquery.scrollex.min.js"></script>
			<script src="/assets/js/jquery.scrolly.min.js"></script>
			<script src="/assets/js/browser.min.js"></script>
			<script src="/assets/js/breakpoints.min.js"></script>
			<script src="/assets/js/util.js"></script>
			<script src="/assets/js/main.js"></script>
			<script>
			const FALLBACK_BACKGROUND_IMAGE = 'https://i.redd.it/muujjjfse8vg1.jpeg';

			const INTRO_BASE =
				'<br> Hello, <br> what you are looking for is away on vacation.';
			const INTRO_APPEND_FALLBACK =
				'<br> In its place, enjoy this photo of North Vancouver, BC.';

			function applyNorthVancouverFallbackBackground() {
				const bg = document.querySelector('#wrapper > .bg');
				const introText = document.getElementById('intro-text');
				if (introText) {
					introText.innerHTML = INTRO_BASE + INTRO_APPEND_FALLBACK;
				}

				const applyBg = () => {
					if (!bg) return;
					bg.style.backgroundImage =
						'url("../../images/overlay.png"), ' +
						'linear-gradient(0deg, rgba(0,0,0,0.1), rgba(0,0,0,0.1)), ' +
						`url("${FALLBACK_BACKGROUND_IMAGE}")`;
					bg.style.backgroundSize = 'auto, auto, cover';
					bg.style.backgroundPosition = 'center, center, center';
				};

				const img = new Image();
				img.onload = () => {
					if (!bg) return;
					bg.style.backgroundImage =
						'url("../../images/overlay.png"), ' +
						'linear-gradient(0deg, rgba(0,0,0,0.1), rgba(0,0,0,0.1)), ' +
						`url("${FALLBACK_BACKGROUND_IMAGE}")`;
					bg.style.backgroundSize = 'auto, auto, cover';
					bg.style.backgroundPosition = 'center, center, center';
				};
				img.onerror = () => {
					applyBg();
				};
				img.src = FALLBACK_BACKGROUND_IMAGE;
			}

			async function setRandomRedditBackgroundWithVerticalDetection() {
				let json;
				try {
					const response = await fetch("/api/reddit");
					json = await response.json();
					if (!response.ok || !json?.data?.children?.length) {
						applyNorthVancouverFallbackBackground();
						return;
					}
				} catch {
					applyNorthVancouverFallbackBackground();
					return;
				}

				const posts = json.data.children.filter(
					p => p.data.post_hint === 'image'
				);

				if (!posts.length) {
					applyNorthVancouverFallbackBackground();
					return;
				}

				const chosen = posts[Math.floor(Math.random() * posts.length)];

				const imageUrl =
					chosen.data.preview?.images?.[0]?.source?.url
						?.replace(/&amp;/g, '&') ||
					chosen.data.url;

				const dataReturn = {
					url: imageUrl,
					permalink: 'https://www.reddit.com' + chosen.data.permalink,
					author: chosen.data.author,
					title: chosen.data.title
				};

				const bg = document.querySelector('#wrapper > .bg');
				if (!bg) {
					applyNorthVancouverFallbackBackground();
					return;
				}

				const img = new Image();
				img.onload = () => {
					const isPortrait = img.height > img.width;

					bg.style.backgroundImage =
						'url("../../images/overlay.png"), ' +
						'linear-gradient(0deg, rgba(0,0,0,0.1), rgba(0,0,0,0.1)), ' +
						`url("${dataReturn.url}")`;

					if (isPortrait) {
						bg.style.backgroundSize = 'auto, auto, cover';
						bg.style.backgroundPosition = 'center, center, center';
					} else {
						bg.style.backgroundSize = 'auto, auto, cover';
						bg.style.backgroundPosition = 'center, center, center';
					}

					const introText = document.getElementById('intro-text');
					if (introText) {
						introText.innerHTML =
							INTRO_BASE +
							'<br> In its place, enjoy this view captured by ' +
							`<a href="${dataReturn.permalink}" target="_blank" rel="noopener">u/${dataReturn.author}</a>.`;
					}
				};
				img.onerror = () => {
					applyNorthVancouverFallbackBackground();
				};
				img.src = dataReturn.url;
			}

			setRandomRedditBackgroundWithVerticalDetection();
			</script>
			<script>
				const intro = document.getElementById('intro');
				const copyright = document.getElementById('copyright');
				const bg = document.querySelector('#wrapper > .bg');

				document.getElementById('Hide').addEventListener('click', () => {
					//document.getElementById('intro').style.display = 'none';
					intro.classList.add('hidden'); 
					//copyright.classList.add('hidden'); 
					//document.getElementById('copyright').style.display = 'none';
				});

				if (bg) {
					bg.addEventListener('click', () => {
						//if (intro) intro.style.display = 'block';
						intro.classList.remove('hidden'); 
						//copyright.classList.remove('hidden'); 
						//if (copyright) copyright.style.display = 'block';
					});
				} 
			</script>






	</body>
</html>
