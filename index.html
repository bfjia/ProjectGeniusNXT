			<script>
			const FALLBACK_BACKGROUND_IMAGE = 'https://i.redd.it/muujjjfse8vg1.jpeg';

			/** Shown while /api/reddit and optional image loads; append only after success or failure. */
			const INTRO_BASE =
				'<br> Hello, the home page is currently on vacation.';
			const INTRO_APPEND_FALLBACK =
				'<br> In its place, enjoy this photo of North Vancouver, BC.';

			function applyNorthVancouverFallbackBackground() {
				const bg = document.querySelector('#wrapper > .bg');
				const introText = document.getElementById('intro-text');
				if (introText) {
					introText.innerHTML = INTRO_BASE + INTRO_APPEND_FALLBACK;
				}

				const applyBg = () => {
					if (!bg) return;
					bg.style.backgroundImage =
						'url("../../images/overlay.png"), ' +
						'linear-gradient(0deg, rgba(0,0,0,0.1), rgba(0,0,0,0.1)), ' +
						`url("${FALLBACK_BACKGROUND_IMAGE}")`;
					bg.style.backgroundSize = 'auto, auto, cover';
					bg.style.backgroundPosition = 'center, center, center';
				};

				const img = new Image();
				img.onload = () => {
					if (!bg) return;
					bg.style.backgroundImage =
						'url("../../images/overlay.png"), ' +
						'linear-gradient(0deg, rgba(0,0,0,0.1), rgba(0,0,0,0.1)), ' +
						`url("${FALLBACK_BACKGROUND_IMAGE}")`;
					bg.style.backgroundSize = 'auto, auto, cover';
					bg.style.backgroundPosition = 'center, center, center';
				};
				img.onerror = () => {
					applyBg();
				};
				img.src = FALLBACK_BACKGROUND_IMAGE;
			}

			async function setRandomRedditBackgroundWithVerticalDetection() {
				let json;
				try {
					const response = await fetch("/api/reddit");
					json = await response.json();
					if (!response.ok || !json?.data?.children?.length) {
						applyNorthVancouverFallbackBackground();
						return;
					}
				} catch {
					applyNorthVancouverFallbackBackground();
					return;
				}

				const posts = json.data.children.filter(
					p => p.data.post_hint === 'image'
				);

				if (!posts.length) {
					applyNorthVancouverFallbackBackground();
					return;
				}

				const chosen = posts[Math.floor(Math.random() * posts.length)];

				const imageUrl =
					chosen.data.preview?.images?.[0]?.source?.url
						?.replace(/&amp;/g, '&') ||
					chosen.data.url;

				const dataReturn = {
					url: imageUrl,
					permalink: 'https://www.reddit.com' + chosen.data.permalink,
					author: chosen.data.author,
					title: chosen.data.title
				};

				const bg = document.querySelector('#wrapper > .bg');
				if (!bg) {
					applyNorthVancouverFallbackBackground();
					return;
				}

				// Load image to detect orientation
				const img = new Image();
				img.onload = () => {
					const isPortrait = img.height > img.width;

					bg.style.backgroundImage =
						'url("../../images/overlay.png"), ' +
						'linear-gradient(0deg, rgba(0,0,0,0.1), rgba(0,0,0,0.1)), ' +
						`url("${dataReturn.url}")`;

					if (isPortrait) {
						bg.style.backgroundSize = 'auto, auto, cover';
						bg.style.backgroundPosition = 'center, center, center';
					} else {
						bg.style.backgroundSize = 'auto, auto, cover';
						bg.style.backgroundPosition = 'center, center, center';
					}

					const introText = document.getElementById('intro-text');
					if (introText) {
						introText.innerHTML =
							INTRO_BASE +
							'<br> In its place, enjoy this view captured by ' +
							`<a href="${dataReturn.permalink}" target="_blank" rel="noopener">u/${dataReturn.author}</a>.`;
					}
				};
				img.onerror = () => {
					applyNorthVancouverFallbackBackground();
				};
				img.src = dataReturn.url;
			}

				async function setRandomRedditBackground() {
					let json;
					try {
						const response = await fetch("/api/reddit");
						json = await response.json();
						if (!response.ok || !json?.data?.children?.length) {
							applyNorthVancouverFallbackBackground();
							return;
						}
					} catch {
						applyNorthVancouverFallbackBackground();
						return;
					}

					const posts = json.data.children.filter(p =>
						p.data.post_hint === 'image'
					);

					if (!posts.length) {
						applyNorthVancouverFallbackBackground();
						return;
					}

					const chosen = posts[Math.floor(Math.random() * posts.length)];

					const dataReturn = {
						url: chosen.data.preview?.images?.[0]?.source?.url
							?.replace(/&amp;/g, '&') || chosen.data.url,
						permalink: 'https://www.reddit.com' + chosen.data.permalink,
						author: chosen.data.author,
						title: chosen.data.title
					};

					const bg = document.querySelector('#wrapper > .bg');
					if (!bg) {
						applyNorthVancouverFallbackBackground();
						return;
					}

					const img = new Image();
					img.onload = () => {
						bg.style.backgroundImage =
							'url("../../images/overlay.png"), ' +
							'linear-gradient(0deg, rgba(0,0,0,0.1), rgba(0,0,0,0.1)), ' +
							`url("${dataReturn.url}")`;
						const introText = document.getElementById('intro-text');
						if (introText) {
							introText.innerHTML =
								INTRO_BASE +
								'<br> In its place, enjoy this view captured by ' +
								`<a href="${dataReturn.permalink}" target="_blank" rel="noopener">u/${dataReturn.author}</a>.`;
						}
					};
					img.onerror = () => {
						applyNorthVancouverFallbackBackground();
					};
					img.src = dataReturn.url;
				}

				setRandomRedditBackgroundWithVerticalDetection();
			</script>
